services:
  # ── Backend (FastAPI + Selenium) ──────────────────────────────────────────
  - type: web
    name: construprice-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: construprice-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: construprice-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://construprice-frontend.onrender.com
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO

  # ── Frontend (Next.js) ───────────────────────────────────────────────────
  - type: web
    name: construprice-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: construprice-backend
          type: web
          property: host

databases:
  - name: construprice-db
    databaseName: construprice
    user: construprice
    plan: free

redis:
  - name: construprice-redis
    plan: free
